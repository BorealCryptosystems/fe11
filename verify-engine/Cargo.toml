[package]
name = "fe11-verify-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "LICENSE", "COPYRIGHT", "NOTICE.txt"]
description = "Optional isolated software verification component for Fe11"

[lib]
crate-type = ["cdylib"]

[dependencies]
fe11-verify-engine-api = { version = "=0.1.0", path = "../verify-engine-api" }
openssl-sys = { version = "=0.9.117", default-features = false }
zeroize = "=1.8.2"
