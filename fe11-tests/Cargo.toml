description = "Public API and SoftHSM interoperability tests for Fe11"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
autotests = false
readme = "README.md"
include = [
    "tests/**", "README.md", "LICENSE", "COPYRIGHT", "NOTICE.txt",
    # Content-addressed native inputs ship losslessly in tests/vectors/native-inputs.tar.xz.
    "!tests/vectors/classical-sign/????????????????????????????????????????????????????????????????.txt",
    "!tests/vectors/dsa/????????????????????????????????????????????????????????????????.txt",
    "!tests/vectors/engine-retained/????????????????????????????????????????????????????????????????.txt",
    "!tests/vectors/mac/????????????????????????????????????????????????????????????????.txt",
    "!tests/vectors/oaep/????????????????????????????????????????????????????????????????.txt",
    "!tests/vectors/oaep-encrypt/????????????????????????????????????????????????????????????????.txt",
    "!tests/vectors/pqc/????????????????????????????????????????????????????????????????.txt",
    "!tests/vectors/pqc-absent/????????????????????????????????????????????????????????????????.txt",
    "!tests/vectors/pqc-binding-negatives/????????????????????????????????????????????????????????????????.txt",
    "!tests/vectors/pqc-random/????????????????????????????????????????????????????????????????.txt",
    "!tests/vectors/pqc-transition/????????????????????????????????????????????????????????????????.txt",
    "!tests/vectors/rsa-domain/????????????????????????????????????????????????????????????????.txt",
]

[[test]]
name = "local"
path = "tests/local.rs"

[[test]]
name = "native"
path = "tests/native/main.rs"
harness = false
test = false

[dev-dependencies]
fe11 = { path = "../library", version = "=0.1.1" }
fe11-sys = "=0.1.0"
fe11-verify-engine-api = { path = "../verify-engine-api", version = "=0.1.0" }
libloading = "=0.8.9"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
x509-cert = { version = "=0.2.5", default-features = false, features = ["std"] }
der = { version = "=0.7.10", default-features = false, features = ["std", "derive"] }
