name: Publish documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'BorealCryptosystems/fe11' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Read the site manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the release asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p _download
          gh release download v0.1.0 --repo "$REPOSITORY" \
            --pattern 'fe11-0.1.0-docs-site.zip' --dir _download
          python3 docs/unpack_site.py --manifest docs/site-manifest.json \
            --archive _download/fe11-0.1.0-docs-site.zip --output _site
      - name: Stage the verified HTML
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
