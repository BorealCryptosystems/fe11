name: SoftHSM single shard

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run that produced the native kit and runtime from this exact commit
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: Rust 1.81.0 / file / Legacy240 / shard 3
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify the checkout and candidate packages
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B ci/scripts/candidate_inputs.py
          python3 -B fe11-tests/tests/driver/fixture_archive.py check
          python3 -B ci/scripts/candidate_matrix.py
          test -z "$(git status --porcelain)"
      - name: Verify the source run belongs to this exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          test "$sha" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.path == ".github/workflows/ci.yml" and .status == "completed"' | grep -Fx true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "build-linux-msrv" or .name == "Prepare the pinned SoftHSM runtime")] | (length == 2 and all(.[]; .conclusion == "success"))' | grep -Fx true
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: native-kit-1.81.0
          path: ${{ runner.temp }}/native-kit
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: native-runtime
          path: ${{ runner.temp }}/native-runtime
      - name: Verify transported images
        run: |
          (cd native-runtime && sha256sum --check SHA256SUMS)
        working-directory: ${{ runner.temp }}
      - name: Verify runtime linkage and execute one shard
        env:
          FE11_ROW: '{"rust":"1.81.0","backend":"file","interface":"Legacy240","shard":3}'
        run: |
          if ! command -v gdb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gdb
          fi
          python3 -B ci/scripts/native_matrix.py shard --row "$FE11_ROW" --root "$RUNNER_TEMP"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-single-shard
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-linkage.json
            ${{ runner.temp }}/out/plan.json
            ${{ runner.temp }}/out/results.jsonl
            ${{ runner.temp }}/out/summary.json
