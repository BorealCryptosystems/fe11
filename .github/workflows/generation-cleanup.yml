name: Generation cleanup validation
on:
  push:
    branches: [codex/fe11-0.1.1-generation-cleanup]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.81.0', '1.100.0']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FE11_EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check exact candidate before compiling
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FE11_EXPECTED_COMMIT"
          python3 -B ci/scripts/candidate_inputs.py
          python3 -B fe11-tests/tests/driver/fixture_archive.py check
          test -z "$(git status --porcelain)"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config libssl-dev perl python3 git ca-certificates
      - name: Compile the package-built native kit without running tests
        run: python3 -B ci/scripts/job.py native-kit --rust '${{ matrix.rust }}' --root "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-kit-${{ matrix.rust }}
          path: ${{ runner.temp }}/build/native-kit/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: build-${{ matrix.rust }}-reports
          path: ${{ runner.temp }}/build/reports/
          if-no-files-found: error
      - name: Remove reproducible build files
        if: always()
        run: python3 -B ci/scripts/cleanup.py --root "$RUNNER_TEMP/build" --parent "$RUNNER_TEMP"
  diagnostic:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.81.0', '1.100.0']
        backend: [file, db]
        interface: [Legacy240, Standard32]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: native-kit-${{ matrix.rust }}
          path: ${{ runner.temp }}/native-kit
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          github-token: ${{ github.token }}
          run-id: 44668526812
          name: native-runtime
          path: ${{ runner.temp }}/native-runtime
      - name: Collect the failed generation scenario once
        env:
          FE11_ROW: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          python3 -B ci/scripts/candidate_inputs.py
          test -z "$(git status --porcelain)"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
          (cd "$RUNNER_TEMP/native-runtime" && sha256sum --check SHA256SUMS)
          python3 -B ci/scripts/diagnose_native.py --row "$FE11_ROW" --root "$RUNNER_TEMP" --selection ci/scripts/generation-selection.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: diagnostic-${{ matrix.rust }}-${{ matrix.backend }}-${{ matrix.interface }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/diagnostics/
            ${{ runner.temp }}/native-linkage.json
