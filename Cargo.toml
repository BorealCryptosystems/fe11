[workspace]
members = ["library", "verify-engine-api", "verify-engine", "ci/softhsm"]
default-members = ["library"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
repository = "https://github.com/BorealCryptosystems/fe11"
authors = ["Benoit de Mulder <bendemulder@borealcryptosystems.com>"]

[profile.release]
overflow-checks = true
panic = "unwind"
